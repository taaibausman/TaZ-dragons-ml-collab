name: MLOps CI Pipeline

on:
  pull_request:
    branches:
      - dev
      - staging
      - main
  push:
    branches:
      - dev
      - staging
      - main

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1. Code Linting & Formatting Check (Ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: 2. Unit Tests & 3. Data Checks & 4. Smoke Train
        run: |
          pytest tests/ -v
