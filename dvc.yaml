stages:
  prepare:
    cmd: python src/prepare.py
    deps:
      - src/prepare.py
      - src/features.py
      - src/utils.py
      - data/raw/titanic.csv
      - params.yaml
    outs:
      - data/processed/train.csv
      - data/processed/test.csv

  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - src/utils.py
      - data/processed/train.csv
      - params.yaml
    outs:
      - models/model.joblib

  evaluate:
    cmd: python src/evaluate.py
    deps:
      - src/evaluate.py
      - src/utils.py
      - data/processed/test.csv
      - models/model.joblib
      - params.yaml
    metrics:
      - metrics.json
